[package]
name = "spicedeck"
version = "0.1.0"
description = "A cross-platform GUI manager for Spicetify"
authors = ["SpiceDeck contributors"]
edition = "2021"

[lib]
name = "spicedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"