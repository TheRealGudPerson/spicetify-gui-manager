name: Validate

on:
  push:
    branches:
      - main
      - feat/v0.3.0-marketplace
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/icon.png --output src-tauri/icons/generated

      - name: Build frontend
        run: npm run build

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
